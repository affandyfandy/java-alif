<form class="w-75" [formGroup]="productForm" (ngSubmit)="onSubmit()">
  <div class="mb-3">
    <label for="name" class="form-label">Name</label>
    <input formControlName="name" class="form-control" id="name">
  </div>
  <div class="mb-3">
    <label for="price" class="form-label">Price</label>
    <input type="number" formControlName="price" class="form-control" id="price" >
  </div>
  <div class="mb-3">
    <label for="status" class="form-label">Status</label>
    <select formControlName="status" class="form-select" id="status">
      <option [value]="true">Active</option>
      <option [value]="false">Inactive</option>
    </select>
  </div>
  <button type="submit" class="btn btn-primary">Save</button>
</form>

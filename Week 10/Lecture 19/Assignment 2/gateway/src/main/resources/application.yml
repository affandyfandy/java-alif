server:
  port: 8080

spring:
  application:
    name: gateway-service
  cloud:
    gateway:
      routes:
        - id: invoice-service
          uri: http://localhost:8081
          predicates:
            - Path=/api/v1/invoices/**
          filters:
            - name: ApiKey
              args:
                baseMessage: This is a base message
                preLogger: true
                postLogger: true

        - id: product-service
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/products/**
          filters:
            - name: ApiKey
              args:
                baseMessage: This is a base message
                preLogger: true
                postLogger: true
  datasource:
    url: jdbc:mysql://localhost:3306/fsoft-lecture-w8
    username: root
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.MySQLDialect
        format_sql: true

logging:
  level:
    org:
      springframework.cloud.gateway: DEBUG
      hibernate:
        sql: DEBUG
        type.descriptor.sql.BasicBinder: TRACE
    reactor.netty.http.client: DEBUG
